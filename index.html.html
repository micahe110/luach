<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שעון חנוך · לוח 364</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#C8A227; --gold-l:#E8D48B; --ink:#0E1830; --silver:#DCE4F2; }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden}
  body{font-family:'Heebo',sans-serif; color:#fff;
       background:#2a3a6a linear-gradient(180deg,#C9D6FF 0%,#E9D3F0 45%,#F7C6D9 100%) center/cover no-repeat;
       display:flex; flex-direction:column; align-items:center;
       padding:calc(env(safe-area-inset-top) + var(--top,6vh)) 16px 16px}
  .sh{text-shadow:0 1px 3px rgba(0,0,0,.55), 0 0 10px rgba(0,0,0,.25)}
  #clock{ text-align:center; margin-bottom:2vh }
  #clock .t{font-family:'Heebo'; font-weight:600; font-size:min(22vw,110px); line-height:1; letter-spacing:.02em}
  #clock .d{font-size:min(5.6vw,26px); margin-top:4px}
  #dialbox{width:min(84vw,62vh,400px); aspect-ratio:1}
  #dial{width:100%; height:100%; display:block; filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
  .card{margin-top:2.2vh; width:min(92vw,440px); background:rgba(14,24,48,.66);
        -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
        border:1px solid rgba(200,162,39,.7); border-radius:22px; padding:14px 16px 12px; text-align:center}
  .greg{font-size:min(4.4vw,18px); color:#E6ECF8}
  .bib{font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:min(8.4vw,36px); color:#F3E3A6; line-height:1.25; margin-top:2px}
  .sub{font-size:min(4.2vw,17px); color:var(--gold-l); margin-top:3px}
  .row{font-size:min(4.1vw,16.5px); color:var(--silver); margin-top:3px}
  .feast{font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:min(5.2vw,21px); color:#F6C343; margin-top:5px}
  .note{font-size:min(3.6vw,14px); color:#B9C6E2; margin-top:3px}
  .sun{display:flex; justify-content:center; gap:18px; margin-top:8px; font-size:min(4.2vw,17px)}
  .sun b{font-weight:600; color:#fff}
  .sun span{color:#C9D4EA}
  .dot{display:inline-block; width:.62em; height:.62em; border-radius:50%; margin-inline-end:5px; vertical-align:middle}
</style>
</head>
<body>
  <div id="clock" class="sh"><div class="t" id="tm">--:--</div><div class="d" id="gd"></div></div>
  <div id="dialbox"><svg id="dial" viewBox="0 0 400 400" aria-label="שעון חנוך"></svg></div>
  <div class="card sh" id="card"></div>

<script>
/* ============================================================
   הגדרות מכתובת ה-URL (כולן לא חובה):
     ?clock=0         בלי שעון דיגיטלי למעלה (אם השעון של סמסונג כבר מוצג)
     ?bg=bg.jpg       תמונת רקע (קובץ באותה תיקייה ב-GitHub, או כתובת מלאה)
     ?lat=31.668&lon=34.574&place=אשקלון   מיקום לזריחה ושקיעה
     ?top=6           מרווח עליון באחוזי גובה המסך
   ============================================================ */
const P = new URLSearchParams(location.search);
const CFG = {
  clock: P.get('clock') !== '0',
  bg: P.get('bg') ?? 'bg.jpg',
  lat: +(P.get('lat') ?? 31.668), lon: +(P.get('lon') ?? 34.574),
  place: P.get('place') ?? 'אשקלון',
  top: P.get('top')
};
if (!CFG.clock) document.getElementById('clock').style.display = 'none';
if (CFG.top !== null) document.body.style.setProperty('--top', CFG.top + 'vh');
if (CFG.bg) { const im = new Image(); im.onload = () => document.body.style.backgroundImage = `url("${CFG.bg}")`; im.src = CFG.bg; }

/* ===== מנוע לוח 364 (כללי הסשיין המאומתים) ===== */
const COURSES=["יהויריב","ידעיה","חרים","שעורים","מלכיה","מימין","הקוץ","אביה","ישוע","שכניהו","אלישיב","יקים","חפה","ישבאב","בלגה","אמר","חזיר","הפצץ","פתחיה","יחזקאל","יכין","גמול","דליהו","מעזיהו"];
const MONTH_ORD=["הראשון","השני","השלישי","הרביעי","החמישי","השישי","השביעי","השמיני","התשיעי","העשירי","האחד עשר","השנים עשר"];
const WEEKDAYS=["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","יום שישי","שבת"];
const WD_SHORT=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","שבת"];
const GREG=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const FEASTS={"1-1":"ראש השנה · יום זיכרון","1-14":"פסח","1-15":"חג המצות — א׳","1-16":"חג המצות — ב׳","1-17":"חג המצות — ג׳","1-18":"חג המצות — ד׳","1-19":"חג המצות — ה׳","1-20":"חג המצות — ו׳","1-21":"חג המצות — ז׳","1-26":"הנפת העומר · ראשית הקציר","2-14":"פסח שני","3-15":"חג השבועות · ביכורי חיטים","4-1":"יום זיכרון · ראש הקיץ","5-3":"מועד היין · ביכורי תירוש","6-22":"מועד השמן · ביכורי יצהר","6-23":"קרבן העצים — א׳","6-24":"קרבן העצים — ב׳","6-25":"קרבן העצים — ג׳","6-26":"קרבן העצים — ד׳","6-27":"קרבן העצים — ה׳","6-28":"קרבן העצים — ו׳","7-1":"יום תרועה · זיכרון תרועה","7-10":"יום הכיפורים","7-15":"חג הסוכות — א׳","7-16":"חג הסוכות — ב׳","7-17":"חג הסוכות — ג׳","7-18":"חג הסוכות — ד׳","7-19":"חג הסוכות — ה׳","7-20":"חג הסוכות — ו׳","7-21":"חג הסוכות — ז׳","7-22":"שמיני עצרת · יום ההקהל","10-1":"יום זיכרון · ראש החורף"};
const COUNTS=[[1,26,"לעומר"],[3,15,"לספירת התירוש"],[5,3,"לספירת היצהר"]];
const GATE=[4,5,6,6,5,4,3,2,1,1,2,3], DPART=[10,11,12,11,10,9,8,7,6,7,8,9];
const DAY=86400000, ANCHOR=Date.UTC(2019,2,20), CYCLE=2191;
const mod=(a,b)=>((a%b)+b)%b, fdiv=(a,b)=>Math.floor(a/b);
function series(s,f){const o=[];let d=s,st=f;while(d<1092){o.push(d);d+=st;st=59-st;}return o;}
const SX=series(1,29), SD=series(17,30);
const doyOf=(m,d)=>(m-1)*30+fdiv(m-1,3)+d;
function gem(n){ if(n===15)return"ט״ו"; if(n===16)return"ט״ז";
  const o=["","א","ב","ג","ד","ה","ו","ז","ח","ט"], t=["","י","כ","ל"];
  const s=t[fdiv(n,10)]+o[n%10]; return s.length>1? s.slice(0,-1)+"״"+s.slice(-1) : s+"׳"; }

function zadok(y,m,d){                         /* תאריך לועזי (מתוקן לזריחה) */
  const n=Math.round((Date.UTC(y,m-1,d)-ANCHOR)/DAY), cyc=fdiv(n,CYCLE), dic=n-cyc*CYCLE;
  const z={n,cyc,dic,wd:mod(n+3,7)};
  if(dic>=2184){ z.cin=z.cout="גמול"; }
  else { z.cin=COURSES[(21+fdiv(dic+4,7))%24]; z.cout=COURSES[(21+fdiv(dic+3,7))%24]; }
  const dib=mod(n,1092)+1;                     /* ירח: ספירה רציפה מהעוגן */
  z.isX=SX.includes(dib); z.isD=SD.includes(dib);
  const nx=SX.find(x=>x>dib); z.toX=nx? nx-dib : SX[0]+1092-dib;
  if(dic>=2184){ Object.assign(z,{ic:true,icDay:dic-2183,em:12}); return z; }
  const year=fdiv(dic,364)+1, doy=dic%364+1, q=fdiv(doy-1,91), w=(doy-1)%91;
  const mi=w<30?0:(w<60?1:2), month=q*3+mi+1, day=w-[0,30,60][mi]+1;
  Object.assign(z,{ic:false,year,doy,month,day,em:month,Y:cyc*6+year});
  z.feast=FEASTS[month+"-"+day]||null; z.count=null;
  for(const [fm,fd,l] of COUNTS){const k=doy-doyOf(fm,fd)+1; if(k>=1&&k<=49) z.count=[k,l];}
  const yf= doy>=doyOf(7,23)? z.Y : z.Y-1; z.shmita = yf>0 && yf%7===0;
  return z;
}

/* ===== זריחה/שקיעה (NOAA) ===== */
const RAD=Math.PI/180;
function solarPos(t){
  const L0=mod(280.46646+t*(36000.76983+t*0.0003032),360), M=357.52911+t*(35999.05029-0.0001537*t);
  const e=0.016708634-t*(0.000042037+0.0000001267*t);
  const C=Math.sin(M*RAD)*(1.914602-t*(0.004817+0.000014*t))+Math.sin(2*M*RAD)*(0.019993-0.000101*t)+Math.sin(3*M*RAD)*0.000289;
  const om=125.04-1934.136*t, app=L0+C-0.00569-0.00478*Math.sin(om*RAD);
  const secs=21.448-t*(46.815+t*(0.00059-t*0.001813)), obl=23+(26+secs/60)/60+0.00256*Math.cos(om*RAD);
  const decl=Math.asin(Math.sin(obl*RAD)*Math.sin(app*RAD))/RAD, yy=Math.tan(obl*RAD/2)**2;
  const eqt=4*(yy*Math.sin(2*L0*RAD)-2*e*Math.sin(M*RAD)+4*e*yy*Math.sin(M*RAD)*Math.cos(2*L0*RAD)-0.5*yy*yy*Math.sin(4*L0*RAD)-1.25*e*e*Math.sin(2*M*RAD))/RAD;
  return {decl,eqt};
}
function sunUTC(y,m,d,rise){                   /* מחזיר Date של הזריחה/השקיעה */
  const jdn=Date.UTC(y,m-1,d)/DAY+2440587.5+0.5; let jd=jdn-0.5+(rise?0.25:0.75), res=0;
  for(let i=0;i<3;i++){ const {decl,eqt}=solarPos((jd-2451545)/36525);
    const cosH=(Math.cos(90.833*RAD)-Math.sin(CFG.lat*RAD)*Math.sin(decl*RAD))/(Math.cos(CFG.lat*RAD)*Math.cos(decl*RAD));
    const H=Math.acos(Math.max(-1,Math.min(1,cosH)))/RAD;
    res=720-4*CFG.lon-eqt+(rise?-4*H:4*H); jd=jdn-0.5+res/1440; }
  return new Date(Date.UTC(y,m-1,d)+res*60000);
}
const locMin=dt=>dt.getHours()*60+dt.getMinutes()+dt.getSeconds()/60;
const hhmm=dt=>dt.getHours()+":"+String(dt.getMinutes()).padStart(2,"0");

/* ===== החוגה ===== */
const S=400, CX=200, CY=200, R=190, RI=R*0.78;
const pt=(a,r)=>{const t=(a-90)*RAD; return [CX+r*Math.cos(t), CY+r*Math.sin(t)];};
const ang=t=>mod(t,1440)/1440*360;
function arc(a1,a2,r1,r2,fill){
  const L=mod(a2-a1,360)>180?1:0, [x1,y1]=pt(a1,r2),[x2,y2]=pt(a2,r2),[x3,y3]=pt(a2,r1),[x4,y4]=pt(a1,r1);
  return `<path d="M${x1},${y1} A${r2},${r2} 0 ${L} 1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 ${L} 0 ${x4},${y4} Z" fill="${fill}"/>`;
}
let staticKey="", staticSVG="";
function dialStatic(rise,set,dp,np,kind,part){
  const key=[Math.round(rise),Math.round(set),dp,kind,part].join();
  if(key===staticKey) return staticSVG;
  const nl=1440-(set-rise); let s='';
  s+=`<circle cx="${CX}" cy="${CY}" r="${R+7}" fill="#0B1430" fill-opacity=".5"/>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="${RI}" fill="#0E1830" fill-opacity=".86"/>`;
  s+=arc(ang(set),ang(rise),RI,R,"#16244A")+arc(ang(rise),ang(set),RI,R,"#E8D48B");
  if(kind==="יום") s+=arc(ang(rise+(set-rise)*(part-1)/dp),ang(rise+(set-rise)*part/dp),RI,R,"#F6C343");
  else s+=arc(ang(set+nl*(part-1)/np),ang(set+nl*part/np),RI,R,"#34508F");
  const ring=(st,len,n,ln,tx,b)=>{for(let i=0;i<n;i++){const a=st+len*i/n,c=st+len*(i+1)/n;
      const [x1,y1]=pt(ang(a),RI),[x2,y2]=pt(ang(a),R),[x,y]=pt(ang((a+c)/2),(R+RI)/2);
      s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ln}" stroke-width="1.6"/>`;
      s+=`<text x="${x}" y="${y+5.5}" font-size="15" font-weight="${b?700:400}" fill="${tx}" text-anchor="middle" font-family="Frank Ruhl Libre,serif">${i+1}</text>`;}};
  ring(rise,set-rise,dp,"#131F3A","#6B4E00",true); ring(set,nl,np,"#2A3C66","#9FB2D6",false);
  s+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#C8A227" stroke-width="2.8"/>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="${RI}" fill="none" stroke="#C8A227" stroke-width="1.6"/>`;
  for(const [t,c,rim] of [[rise,"#F6C343","#FFF3C4"],[set,"#E07B39","#FFD2A8"]]){const [x,y]=pt(ang(t),R+4); s+=`<circle cx="${x}" cy="${y}" r="6.5" fill="${c}" stroke="${rim}" stroke-width="1.3"/>`;}
  for(let k=0;k<60;k++){const b=k%5===0,[x1,y1]=pt(k*6,RI-3),[x2,y2]=pt(k*6,RI-(b?13:7.5));
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${b?"#C8A227":"#5A6B85"}" stroke-width="${b?1.6:1}"/>`;}
  for(let h=0;h<24;h++){const [x,y]=pt(h*15,RI*0.80), m=h%6===0;
    s+=`<text x="${x}" y="${y+(m?6.6:5.4)}" font-size="${m?19:15}" font-weight="${m?700:400}" fill="${m?"#fff":"#C9D4EA"}" text-anchor="middle" font-family="Heebo,sans-serif">${h||24}</text>`;}
  staticKey=key; staticSVG=s; return s;
}
function hands(nowMin, secs){
  const ha=ang(nowMin), ma=(nowMin%60)*6;
  const L=RI*0.62, w=7, tail=RI*0.10;
  let s=`<g transform="rotate(${ha} ${CX} ${CY})"><path d="M${CX-w},${CY+tail} L${CX-w*0.55},${CY-L+w*2} L${CX},${CY-L} L${CX+w*0.55},${CY-L+w*2} L${CX+w},${CY+tail} Z" fill="#fff" stroke="#0E1830" stroke-width="1.6" stroke-linejoin="round"/></g>`;
  const Lm=RI*0.95, wm=2.6, hl=22, hw=9.5;
  s+=`<g transform="rotate(${ma} ${CX} ${CY})"><rect x="${CX-wm}" y="${CY-Lm+hl*0.8}" width="${2*wm}" height="${Lm-hl*0.8+RI*0.16}" rx="${wm}" fill="#E8D48B" stroke="#0E1830" stroke-width="1.2"/>`+
     `<path d="M${CX},${CY-Lm} L${CX+hw},${CY-Lm+hl} L${CX},${CY-Lm+hl*0.75} L${CX-hw},${CY-Lm+hl} Z" fill="#F6C343" stroke="#0E1830" stroke-width="1.2" stroke-linejoin="round"/></g>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="9.5" fill="#C8A227" stroke="#0E1830" stroke-width="1.2"/><circle cx="${CX}" cy="${CY}" r="3.2" fill="#0E1830"/>`;
  return s;
}
function centerText(kind,part,of){
  const halo='paint-order="stroke" stroke="#0E1830" stroke-width="5" stroke-linejoin="round"';
  return `<text x="${CX}" y="${CY-RI*0.30}" font-size="14.5" fill="#E8D48B" text-anchor="middle" direction="rtl" font-family="Heebo,sans-serif" ${halo}>חלק ${part} מתוך ${of} ב${kind}</text>`;
}

/* ===== ציור ===== */
function draw(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth()+1, d=now.getDate();
  const nm=locMin(now);
  const riseD=sunUTC(y,m,d,true), setD=sunUTC(y,m,d,false);
  const rise=locMin(riseD), set=locMin(setD);
  const before = nm < rise;
  const bd=new Date(y,m-1,d-(before?1:0));
  const z=zadok(bd.getFullYear(),bd.getMonth()+1,bd.getDate());
  const dp=DPART[z.em-1], np=18-dp, gi=z.em-1;
  let kind,part,of;
  if(nm>=rise && nm<set){kind="יום"; of=dp; part=Math.min(dp,fdiv(nm-rise,(set-rise)/dp)+1);}
  else {const nl=1440-(set-rise); kind="לילה"; of=np; part=Math.min(np,fdiv(mod(nm-set,1440),nl/np)+1);}

  document.getElementById('dial').innerHTML = dialStatic(rise,set,dp,np,kind,part)+centerText(kind,part,of)+hands(nm);

  // שעון דיגיטלי + תאריך לועזי
  document.getElementById('tm').textContent = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  document.getElementById('gd').textContent = `יום ${WD_SHORT[now.getDay()]}${now.getDay()===6?"":""}, ${d} ב${GREG[m-1]}`;

  // כרטיס המידע
  let h=`<div class="greg">${d} ב${GREG[m-1]} ${y}</div>`;
  if(z.ic){
    h+=`<div class="bib">שבוע העיבור · יום ${gem(z.icDay)}</div><div class="sub">${WEEKDAYS[z.wd]} · כל הכהנים עם גמול</div>`;
  } else {
    let yr=`שנה ${gem(z.year)} במחזור`; if(z.year===1) yr+=" · אות גמול"; if(z.year===4) yr+=" · אות שכניה";
    h+=`<div class="bib">${gem(z.day)} לחודש ${MONTH_ORD[z.month-1]}</div><div class="sub">${WEEKDAYS[z.wd]} · ${yr}</div>`;
    h+= (z.wd===6 && z.cin!==z.cout) ? `<div class="row">משמרת ${z.cout} יוצאת · ${z.cin} נכנסת</div>` : `<div class="row">משמרת ${z.cin}</div>`;
    if(z.feast) h+=`<div class="feast">${z.feast}</div>`;
    if(z.count) h+=`<div class="row">היום ${z.count[0]} ${z.count[1]}</div>`;
    if(z.shmita) h+=`<div class="note">שנת השמיטה</div>`;
  }
  h+=`<div class="row">שער ${GATE[gi]} · יום ${dp} חלקים · לילה ${np} · ${z.isX?"X — מילוא סכמטי":z.isD?"דוקה — ליל הסהר הראשון":"X בעוד "+z.toX+" ימים"}</div>`;
  if(before) h+=`<div class="note">לפני הזריחה — עדיין היום המקראי של אתמול</div>`;
  h+=`<div class="sun"><span><i class="dot" style="background:#F6C343"></i>זריחה <b>${hhmm(riseD)}</b></span><span><i class="dot" style="background:#E07B39"></i>שקיעה <b>${hhmm(setD)}</b></span></div>`;
  h+=`<div class="note">${CFG.place}</div>`;
  const card=document.getElementById('card'); if(card.innerHTML!==h) card.innerHTML=h;
}
draw();
setInterval(draw, 10000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) draw(); });

/* בדיקה: ?test=1 */
if(P.get('test')==='1'){
  const T=[[2019,3,20,{year:1,month:1,day:1,wd:3,cin:"גמול",isX:true}],[2019,5,5,{month:2,day:17,cin:"מלכיה",isD:true}],
    [2019,7,21,{month:5,day:3,cin:"אמר"}],[2019,9,13,{month:6,day:27,cin:"דליהו",isX:true}],[2022,3,16,{year:4,month:1,day:1,cin:"שכניהו",isX:true}],
    [2025,3,14,{ic:true,icDay:3,cin:"גמול"}],[2025,3,8,{cin:"גמול"}],[2025,3,22,{cin:"דליהו"}],[2025,4,1,{month:1,day:14,wd:2,cin:"מעזיהו"}],
